report_comment: >
  This report has been generated by the <a href="https://github.com/UMCUGenetics/DxNextflowPRS" target="_blank">DxNextflowPRS</a>
  analysis pipeline.
report_section_order:
  ancestry_knn:
    order: -1001
  ancestry_flagged_pca:
    order: -1002
  "UMCUGenetics-DxNextflowPRS-summary":
    order: -1003
  software_versions:
    order: -1004



custom_data:
  ancestry_knn:
    section_name: "Ancestry"
    description: "Ancesry asignment is based on a PCA with 1000G project data, followed by k-nearest neighbour (kNN) clustering. Rule of thumb for confidence: >= 0.7 is accurate. < 0.7 indicates admixture / less confidence.
    For breast cancer (BCAC-313), variants were selected based on case–control studies conducted predominantly in individuals of West European ancestry. As a result, the risk score may be less accurate when applied to individuals from other ancestral backgrounds, with particularly reduced performance reported in people of African ancestry."
    file_format: "tsv"
    plot_type: "table"
    pconfig:
      id: "ancestry_knn"
      title: "Ancestry (kNN)"
      namespace: "Ancestry"
      sort_rows: false

sp:
  ancestry_knn:
    fn: "ancestry_knn_mqc.tsv"

custom_sections:
  ancestry_flagged_pca:
    section_name: "Ancestry PCA (flagged samples)"
    description: "Per-sample PCA plot for samples that were flagged (e.g. confidence < threshold or non-EUR)."
    file: "*knn_pca.png"

export_plots: true
disable_version_detection: true
